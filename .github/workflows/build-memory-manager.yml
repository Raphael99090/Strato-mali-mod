name: Build Android APK - Memory Manager

on:
  workflow_dispatch:
  push:
    branches:
      - fix/memory-manager

permissions:
  contents: read

jobs:
  build:
    name: Compile Strato Mali ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Initialize submodules with retry
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git -c protocol.version=2 submodule update --init --depth=1 --recursive; then
              exit 0
            fi
            echo "Submodule initialization attempt $attempt failed."
            sleep 10
          done
          exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-strato-memory-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-strato-memory-gradle-

      - name: Validate Kotlin compilation
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace compileMainlineReleaseKotlin

      - name: Build Release APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew --no-daemon --stacktrace --build-cache --parallel assembleMainlineRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Strato-Mali-Memory-Manager-APK
          path: app/build/outputs/apk/mainline/release/*.apk
          if-no-files-found: error
          retention-days: 14
